name: test-hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      issues: write
    uses: ferhanburak/test-hub/.github/workflows/web-ci.yml@main
    with:
      project: celtikci
      suite: ${{ github.event_name == 'workflow_dispatch' && 'full' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'e2e' || 'fast' }}
